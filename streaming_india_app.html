
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
  
  /* NAV */
  .nav { position: sticky; top: 0; z-index: 100; background: linear-gradient(#0a0a0a, transparent); padding: 12px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .nav-logo { font-size: 22px; font-weight: 800; letter-spacing: -1px; cursor: pointer; }
  .nav-logo.netflix { color: #e50914; }
  .nav-logo.prime { color: #00a8e1; }
  .nav-logo.hotstar { color: #1f80e0; }
  .nav-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav-tab { padding: 7px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1.5px solid transparent; transition: all .2s; }
  .nav-tab:hover { background: rgba(255,255,255,.1); }
  .nav-tab.active { border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.1); }
  .nav-right { margin-left: auto; display: flex; gap: 8px; }
  .icon-btn { background: rgba(255,255,255,.08); border: none; color: #fff; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: background .2s; }
  .icon-btn:hover { background: rgba(255,255,255,.18); }
  .badge { background: #e50914; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center; }

  /* PLATFORM SWITCHER */
  .platform-bar { display: flex; gap: 12px; padding: 8px 20px 0; overflow-x: auto; scrollbar-width: none; }
  .platform-bar::-webkit-scrollbar { display: none; }
  .platform-btn { flex-shrink: 0; padding: 9px 22px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; border: 2px solid transparent; transition: all .2s; opacity: .55; }
  .platform-btn:hover { opacity: .8; }
  .platform-btn.active { opacity: 1; border-color: currentColor; }
  .platform-btn.netflix { color: #e50914; }
  .platform-btn.prime { color: #00a8e1; }
  .platform-btn.hotstar { color: #f5a623; }

  /* HERO */
  .hero { position: relative; height: 320px; margin: 16px 0; overflow: hidden; border-radius: 0; }
  .hero-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.5); }
  .hero-gradient { position: absolute; inset: 0; background: linear-gradient(to right, rgba(10,10,10,.9) 30%, transparent 70%), linear-gradient(to top, rgba(10,10,10,1) 0%, transparent 40%); }
  .hero-content { position: absolute; bottom: 30px; left: 24px; max-width: 420px; }
  .hero-title { font-size: 28px; font-weight: 800; line-height: 1.1; margin-bottom: 8px; }
  .hero-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 13px; color: #ccc; flex-wrap: wrap; }
  .hero-rating { background: #f5c518; color: #000; font-weight: 800; font-size: 12px; padding: 3px 8px; border-radius: 4px; }
  .hero-desc { font-size: 13px; color: #ccc; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hero-btns { display: flex; gap: 10px; margin-top: 14px; }
  .hero-btn { padding: 9px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; }
  .hero-btn.primary { background: #fff; color: #000; }
  .hero-btn.secondary { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.3); }

  /* ROWS */
  .section { padding: 0 20px 28px; }
  .section-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .section-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
  .badge-trending { background: #e50914; color: #fff; }
  .badge-top { background: #f5c518; color: #000; }
  .cards-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .cards-row::-webkit-scrollbar { height: 4px; }
  .cards-row::-webkit-scrollbar-track { background: transparent; }
  .cards-row::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

  /* CARD */
  .card { flex-shrink: 0; width: 140px; cursor: pointer; position: relative; transition: transform .2s; border-radius: 8px; overflow: hidden; }
  .card:hover { transform: scale(1.06); z-index: 5; }
  .card-img { width: 140px; height: 210px; object-fit: cover; display: block; background: #1a1a1a; }
  .card-img-placeholder { width: 140px; height: 210px; background: #1e1e1e; display: flex; align-items: center; justify-content: center; color: #555; font-size: 11px; text-align: center; padding: 8px; }
  .card-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.95)); padding: 20px 8px 8px; }
  .card-rating { background: #f5c518; color: #000; font-size: 10px; font-weight: 800; padding: 2px 5px; border-radius: 3px; display: inline-block; margin-bottom: 3px; }
  .card-title { font-size: 11px; font-weight: 600; line-height: 1.3; }
  .card-year { font-size: 10px; color: #999; margin-top: 2px; }
  .card-actions { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; gap: 5px; opacity: 0; transition: opacity .2s; }
  .card:hover .card-actions { opacity: 1; }
  .action-btn { width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: transform .1s; }
  .action-btn:hover { transform: scale(1.15); }
  .btn-watch { background: rgba(40,200,100,.9); }
  .btn-star { background: rgba(245,197,24,.9); }
  .btn-watched-active { background: rgba(40,200,100,1); opacity: 1 !important; }
  .btn-star-active { background: rgba(245,197,24,1); opacity: 1 !important; }

  /* MODAL */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: #181818; border-radius: 12px; max-width: 520px; width: 100%; max-height: 85vh; overflow-y: auto; position: relative; }
  .modal-img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px 12px 0 0; }
  .modal-body { padding: 20px; }
  .modal-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .modal-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: #ccc; align-items: center; }
  .modal-rating-big { background: #f5c518; color: #000; font-weight: 800; padding: 4px 10px; border-radius: 5px; font-size: 15px; }
  .modal-desc { font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 16px; }
  .modal-platforms { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .plat-tag { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .pt-netflix { background: rgba(229,9,20,.2); color: #e50914; border: 1px solid rgba(229,9,20,.3); }
  .pt-prime { background: rgba(0,168,225,.2); color: #00a8e1; border: 1px solid rgba(0,168,225,.3); }
  .pt-hotstar { background: rgba(245,166,35,.2); color: #f5a623; border: 1px solid rgba(245,166,35,.3); }
  .modal-actions { display: flex; gap: 10px; }
  .modal-action-btn { flex: 1; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .modal-action-btn.watched { background: #1db954; color: #fff; }
  .modal-action-btn.watchlist { background: #f5c518; color: #000; }
  .modal-action-btn.active-watched { background: #0a8a3a; }
  .modal-action-btn.active-list { background: #c9a000; }
  .modal-close { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.6); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }

  /* ARCHIVE PAGES */
  .archive-page { padding: 20px; display: none; }
  .archive-page.active { display: block; }
  .archive-header { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .archive-sub { font-size: 14px; color: #888; margin-bottom: 20px; }
  .archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
  .archive-empty { text-align: center; padding: 60px 20px; color: #555; }
  .archive-empty-icon { font-size: 48px; margin-bottom: 12px; }
  .archive-empty-text { font-size: 16px; }

  /* LOADING */
  .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: #666; font-size: 14px; }
  .spinner { width: 28px; height: 28px; border: 3px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .shimmer { background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* GENRES */
  .genre-filter { display: flex; gap: 8px; padding: 0 20px 16px; overflow-x: auto; scrollbar-width: none; }
  .genre-filter::-webkit-scrollbar { display: none; }
  .genre-chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #333; background: transparent; color: #aaa; transition: all .2s; white-space: nowrap; }
  .genre-chip.active { background: #fff; color: #000; border-color: #fff; font-weight: 600; }

  /* TOAST */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* SCROLLBAR GLOBAL */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
</style>
</head>
<body>

<div id="app">
  <!-- NAVIGATION -->
  <div class="nav">
    <div class="nav-logo netflix" id="logo">STREAMIQ</div>
    <div class="nav-tabs">
      <div class="nav-tab active" onclick="showMainPage()">Home</div>
      <div class="nav-tab" onclick="showArchive('watched')">✓ Watched <span class="badge" id="watched-count">0</span></div>
      <div class="nav-tab" onclick="showArchive('watchlist')">★ Watchlist <span class="badge" id="watchlist-count">0</span></div>
    </div>
  </div>

  <!-- PLATFORM SWITCHER -->
  <div class="platform-bar" id="platform-bar">
    <button class="platform-btn netflix active" onclick="switchPlatform('netflix', this)">NETFLIX</button>
    <button class="platform-btn prime" onclick="switchPlatform('prime', this)">PRIME VIDEO</button>
    <button class="platform-btn hotstar" onclick="switchPlatform('hotstar', this)">JIO HOTSTAR</button>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main-page">
    <div id="hero-section"></div>
    <div id="genre-filter-bar" class="genre-filter"></div>
    <div id="content-rows"></div>
  </div>

  <!-- ARCHIVE PAGES -->
  <div id="watched-page" class="archive-page">
    <div class="archive-header">✓ Already Watched</div>
    <div class="archive-sub" id="watched-sub">Your completed watchlist</div>
    <div class="archive-grid" id="watched-grid"></div>
    <div class="archive-empty" id="watched-empty" style="display:none">
      <div class="archive-empty-icon">🎬</div>
      <div class="archive-empty-text">No watched titles yet.<br>Mark titles as watched from the main page.</div>
    </div>
  </div>

  <div id="watchlist-page" class="archive-page">
    <div class="archive-header">★ Want to Watch</div>
    <div class="archive-sub" id="watchlist-sub">Your saved watchlist</div>
    <div class="archive-grid" id="watchlist-grid"></div>
    <div class="archive-empty" id="watchlist-empty" style="display:none">
      <div class="archive-empty-icon">⭐</div>
      <div class="archive-empty-text">No saved titles yet.<br>Star titles to add them here.</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-inner">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img class="modal-img" id="modal-img" src="" alt="">
    <div class="modal-body">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="modal-desc" id="modal-desc"></div>
      <div class="modal-platforms" id="modal-platforms"></div>
      <div class="modal-actions">
        <button class="modal-action-btn watched" id="modal-watched-btn" onclick="toggleFromModal('watched')">✓ Mark Watched</button>
        <button class="modal-action-btn watchlist" id="modal-watchlist-btn" onclick="toggleFromModal('watchlist')">★ Add to Watchlist</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const TMDB_KEY = '8265bd1679663a7ea12ac168da84d2e8';
const TMDB_BASE = 'https://api.themoviedb.org/3';
const IMG_BASE = 'https://image.tmdb.org/t/p/';

let currentPlatform = 'netflix';
let currentView = 'main';
let currentGenre = 'all';
let modalItem = null;
let allContent = {};
let userData = { watched: {}, watchlist: {} };

// Platform config
const PLATFORMS = {
  netflix: {
    name: 'Netflix India',
    color: '#e50914',
    watchId: 8, // Netflix watch provider ID
    accent: '#e50914',
    tagClass: 'pt-netflix'
  },
  prime: {
    name: 'Prime Video India',
    color: '#00a8e1',
    watchId: 9, // Amazon Prime
    accent: '#00a8e1',
    tagClass: 'pt-prime'
  },
  hotstar: {
    name: 'Jio Hotstar India',
    color: '#f5a623',
    watchId: 122, // Hotstar
    accent: '#f5a623',
    tagClass: 'pt-hotstar'
  }
};

const GENRES = [
  { id: 'all', name: 'All' },
  { id: 28, name: 'Action' },
  { id: 35, name: 'Comedy' },
  { id: 27, name: 'Horror' },
  { id: 18, name: 'Drama' },
  { id: 878, name: 'Sci-Fi' },
  { id: 10749, name: 'Romance' },
  { id: 53, name: 'Thriller' },
  { id: 16, name: 'Animation' },
  { id: 80, name: 'Crime' },
  { id: 14, name: 'Fantasy' },
  { id: 99, name: 'Documentary' }
];

// Storage helpers
async function saveData() {
  try {
    await window.storage.set('streamiq_userdata', JSON.stringify(userData), false);
  } catch(e) {}
}

async function loadData() {
  try {
    const r = await window.storage.get('streamiq_userdata', false);
    if (r && r.value) userData = JSON.parse(r.value);
  } catch(e) {}
  updateCounts();
}

function updateCounts() {
  document.getElementById('watched-count').textContent = Object.keys(userData.watched).length;
  document.getElementById('watchlist-count').textContent = Object.keys(userData.watchlist).length;
}

// Toast
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// API Fetch
async function tmdb(endpoint, params = {}) {
  const url = new URL(TMDB_BASE + endpoint);
  url.searchParams.set('api_key', TMDB_KEY);
  url.searchParams.set('language', 'en-US');
  url.searchParams.set('region', 'IN');
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  try {
    const r = await fetch(url);
    return await r.json();
  } catch(e) { return { results: [] }; }
}

// Fetch trending
async function fetchTrending(type = 'all') {
  return tmdb('/trending/' + type + '/week');
}

// Fetch by platform + genre
async function fetchByProvider(providerId, genreId, type = 'movie') {
  const params = {
    with_watch_providers: providerId,
    watch_region: 'IN',
    sort_by: 'vote_average.desc',
    'vote_count.gte': 200,
    'vote_average.gte': 7.0,
    with_watch_monetization_types: 'flatrate|free'
  };
  if (genreId && genreId !== 'all') params.with_genres = genreId;
  return tmdb('/discover/' + type, params);
}

async function fetchGenreContent(providerId, genreId, type) {
  const params = {
    with_watch_providers: providerId,
    watch_region: 'IN',
    sort_by: 'vote_average.desc',
    'vote_count.gte': 150,
    'vote_average.gte': 6.5,
    with_watch_monetization_types: 'flatrate|free',
    with_genres: genreId
  };
  return tmdb('/discover/' + type, params);
}

function imgUrl(path, size = 'w342') {
  return path ? IMG_BASE + size + path : '';
}

// Render card
function renderCard(item) {
  const id = item.id;
  const title = item.title || item.name || 'Unknown';
  const year = (item.release_date || item.first_air_date || '').slice(0, 4);
  const rating = item.vote_average ? item.vote_average.toFixed(1) : '?';
  const poster = imgUrl(item.poster_path);
  const isWatched = !!userData.watched[id];
  const isWatchlist = !!userData.watchlist[id];

  const imgEl = poster
    ? `<img class="card-img" src="${poster}" alt="${title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const placeholder = `<div class="card-img-placeholder" ${poster ? 'style="display:none"' : ''}>${title}</div>`;

  return `
    <div class="card" data-id="${id}" onclick="openModal(${id})">
      ${imgEl}${placeholder}
      <div class="card-overlay">
        <div class="card-rating">⭐ ${rating}</div>
        <div class="card-title">${title}</div>
        <div class="card-year">${year}</div>
      </div>
      <div class="card-actions">
        <button class="action-btn btn-watch ${isWatched ? 'btn-watched-active' : ''}" 
          onclick="event.stopPropagation();toggleItem(${id},'watched')" 
          title="Mark watched">✓</button>
        <button class="action-btn btn-star ${isWatchlist ? 'btn-star-active' : ''}" 
          onclick="event.stopPropagation();toggleItem(${id},'watchlist')" 
          title="Add to watchlist">★</button>
      </div>
    </div>`;
}

// Render row
function renderRow(title, items, badgeClass, badgeText) {
  if (!items || !items.length) return '';
  const badge = badgeText ? `<span class="section-badge ${badgeClass}">${badgeText}</span>` : '';
  const cards = items.slice(0, 20).map(renderCard).join('');
  return `
    <div class="section">
      <div class="section-title">${title} ${badge}</div>
      <div class="cards-row">${cards}</div>
    </div>`;
}

// Build genre filter
function buildGenreFilter() {
  const bar = document.getElementById('genre-filter-bar');
  bar.innerHTML = GENRES.map(g => 
    `<button class="genre-chip ${g.id === 'all' ? 'active' : ''}" 
      data-genre="${g.id}" onclick="filterGenre('${g.id}', this)">${g.name}</button>`
  ).join('');
}

async function filterGenre(genreId, el) {
  currentGenre = genreId;
  document.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  await loadPlatformContent();
}

// Hero
function renderHero(item) {
  if (!item) return '';
  const title = item.title || item.name || '';
  const desc = item.overview || '';
  const year = (item.release_date || item.first_air_date || '').slice(0, 4);
  const rating = item.vote_average ? item.vote_average.toFixed(1) : '';
  const backdrop = item.backdrop_path ? imgUrl(item.backdrop_path, 'w1280') : '';
  const type = item.media_type === 'tv' || item.first_air_date ? 'TV Series' : 'Movie';

  return `
    <div class="hero">
      ${backdrop ? `<img class="hero-img" src="${backdrop}" alt="${title}">` : `<div style="width:100%;height:100%;background:#1a1a1a;"></div>`}
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div class="hero-title">${title}</div>
        <div class="hero-meta">
          <span class="hero-rating">⭐ ${rating}</span>
          <span>${year}</span>
          <span>${type}</span>
        </div>
        <div class="hero-desc">${desc}</div>
        <div class="hero-btns">
          <button class="hero-btn primary" onclick="openModal(${item.id})">ℹ More Info</button>
        </div>
      </div>
    </div>`;
}

// Shimmer loading
function showLoading() {
  const shimCards = Array(6).fill(0).map(() => 
    `<div class="shimmer" style="width:140px;height:210px;flex-shrink:0;border-radius:8px;"></div>`
  ).join('');
  document.getElementById('content-rows').innerHTML = `
    <div class="section">
      <div class="section-title"><div class="shimmer" style="width:180px;height:18px;border-radius:4px;"></div></div>
      <div class="cards-row">${shimCards}</div>
    </div>`.repeat(3);
}

// Main loader
async function loadPlatformContent() {
  const p = PLATFORMS[currentPlatform];
  showLoading();

  // Fetch concurrently
  const [trending, topMovies, topTV] = await Promise.all([
    fetchTrending('all'),
    fetchByProvider(p.watchId, currentGenre, 'movie'),
    fetchByProvider(p.watchId, currentGenre, 'tv')
  ]);

  // Genre rows
  const genreRows = [];
  const activeGenres = currentGenre === 'all' 
    ? GENRES.slice(1, 7) 
    : GENRES.filter(g => g.id == currentGenre);
  
  const genreData = await Promise.all(
    activeGenres.map(g => 
      Promise.all([
        fetchGenreContent(p.watchId, g.id, 'movie'),
        fetchGenreContent(p.watchId, g.id, 'tv')
      ]).then(([mv, tv]) => ({ genre: g, movies: mv.results || [], tvs: tv.results || [] }))
    )
  );

  // Hero
  const heroItems = trending.results?.filter(i => i.backdrop_path) || [];
  const heroItem = heroItems[Math.floor(Math.random() * Math.min(5, heroItems.length))];
  document.getElementById('hero-section').innerHTML = heroItem ? renderHero(heroItem) : '';

  // Build rows
  let rowsHTML = '';
  
  // Trending
  const trendingItems = trending.results?.slice(0, 20) || [];
  if (trendingItems.length) {
    rowsHTML += renderRow('🔥 Trending Now on ' + p.name, trendingItems, 'badge-trending', 'LIVE');
  }

  // Top Rated Movies
  const topMovieItems = topMovies.results?.slice(0, 20) || [];
  if (topMovieItems.length) {
    rowsHTML += renderRow('⭐ Top Rated Movies', topMovieItems, 'badge-top', 'TOP PICKS');
  }

  // Top Rated TV
  const topTVItems = topTV.results?.slice(0, 20) || [];
  if (topTVItems.length) {
    rowsHTML += renderRow('📺 Top Rated TV Series', topTVItems, 'badge-top', 'TOP PICKS');
  }

  // Genre rows
  for (const { genre, movies, tvs } of genreData) {
    const combined = [...movies, ...tvs]
      .filter((item, idx, arr) => arr.findIndex(i => i.id === item.id) === idx)
      .sort((a, b) => b.vote_average - a.vote_average)
      .slice(0, 20);
    if (combined.length) {
      rowsHTML += renderRow(genre.name, combined, '', '');
    }
  }

  document.getElementById('content-rows').innerHTML = rowsHTML || '<div class="loading">No content found for this selection.</div>';

  // Cache for modal lookup
  const allItems = [...trendingItems, ...topMovieItems, ...topTVItems];
  genreData.forEach(({ movies, tvs }) => allItems.push(...movies, ...tvs));
  allItems.forEach(item => { allContent[item.id] = item; });
}

// Platform switch
async function switchPlatform(platform, el) {
  currentPlatform = platform;
  document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('logo').className = 'nav-logo ' + platform;
  const p = PLATFORMS[platform];
  document.getElementById('logo').style.color = p.color;
  await loadPlatformContent();
}

// Modal
async function openModal(id) {
  const cached = allContent[id];
  const modal = document.getElementById('modal');
  modal.classList.add('open');
  
  if (cached) {
    populateModal(cached);
  }
  
  // Fetch full details
  const type = cached?.media_type === 'tv' || cached?.first_air_date ? 'tv' : 'movie';
  try {
    const details = await tmdb('/' + type + '/' + id, { append_to_response: 'videos' });
    allContent[id] = { ...cached, ...details, media_type: type };
    populateModal(allContent[id]);
  } catch(e) {}
}

function populateModal(item) {
  if (!item) return;
  modalItem = item;
  const title = item.title || item.name || '';
  const year = (item.release_date || item.first_air_date || '').slice(0, 4);
  const rating = item.vote_average ? item.vote_average.toFixed(1) : '?';
  const votes = item.vote_count ? item.vote_count.toLocaleString() : '';
  const runtime = item.runtime ? item.runtime + ' min' : (item.episode_run_time?.[0] ? item.episode_run_time[0] + ' min/ep' : '');
  const genres = (item.genres || []).map(g => g.name).join(', ');
  const type = item.media_type === 'tv' || item.first_air_date ? 'TV Series' : 'Movie';
  const backdrop = item.backdrop_path ? imgUrl(item.backdrop_path, 'w780') : (item.poster_path ? imgUrl(item.poster_path, 'w500') : '');
  const isWatched = !!userData.watched[item.id];
  const isWatchlist = !!userData.watchlist[item.id];

  document.getElementById('modal-img').src = backdrop;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-meta').innerHTML = `
    <span class="modal-rating-big">⭐ ${rating}/10</span>
    <span>${votes} votes</span>
    <span>${year}</span>
    <span>${type}</span>
    ${runtime ? `<span>${runtime}</span>` : ''}
    ${genres ? `<span>${genres}</span>` : ''}
  `;
  document.getElementById('modal-desc').textContent = item.overview || 'No description available.';

  // Platform tags
  const p = PLATFORMS[currentPlatform];
  document.getElementById('modal-platforms').innerHTML = 
    `<span class="plat-tag ${p.tagClass}">${p.name}</span>`;

  const wBtn = document.getElementById('modal-watched-btn');
  const lBtn = document.getElementById('modal-watchlist-btn');
  wBtn.textContent = isWatched ? '✓ Watched' : '✓ Mark Watched';
  wBtn.className = 'modal-action-btn watched' + (isWatched ? ' active-watched' : '');
  lBtn.textContent = isWatchlist ? '★ In Watchlist' : '★ Add to Watchlist';
  lBtn.className = 'modal-action-btn watchlist' + (isWatchlist ? ' active-list' : '');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  if (!e) document.getElementById('modal').classList.remove('open');
  document.getElementById('modal').classList.remove('open');
}

async function toggleItem(id, type) {
  const item = allContent[id];
  if (!item) return;

  if (userData[type][id]) {
    delete userData[type][id];
    showToast(type === 'watched' ? '✓ Removed from watched' : '★ Removed from watchlist');
  } else {
    userData[type][id] = {
      id: item.id,
      title: item.title || item.name,
      poster: item.poster_path,
      rating: item.vote_average,
      year: (item.release_date || item.first_air_date || '').slice(0, 4),
      overview: item.overview,
      media_type: item.media_type || (item.first_air_date ? 'tv' : 'movie')
    };
    // If marking watched, remove from watchlist
    if (type === 'watched' && userData.watchlist[id]) {
      delete userData.watchlist[id];
    }
    showToast(type === 'watched' ? '✓ Added to watched!' : '★ Added to watchlist!');
  }
  await saveData();
  updateCounts();
  refreshCardButtons(id);
}

async function toggleFromModal(type) {
  if (!modalItem) return;
  await toggleItem(modalItem.id, type);
  populateModal(modalItem);
}

function refreshCardButtons(id) {
  const cards = document.querySelectorAll(`.card[data-id="${id}"]`);
  cards.forEach(card => {
    const wBtn = card.querySelector('.btn-watch');
    const sBtn = card.querySelector('.btn-star');
    if (wBtn) wBtn.classList.toggle('btn-watched-active', !!userData.watched[id]);
    if (sBtn) sBtn.classList.toggle('btn-star-active', !!userData.watchlist[id]);
  });
}

// Archive pages
function showMainPage() {
  document.getElementById('main-page').style.display = 'block';
  document.getElementById('platform-bar').style.display = 'flex';
  document.getElementById('genre-filter-bar').style.display = 'flex';
  document.getElementById('hero-section').style.display = 'block';
  document.getElementById('watched-page').classList.remove('active');
  document.getElementById('watchlist-page').classList.remove('active');
  document.querySelectorAll('.nav-tab').forEach((t, i) => t.classList.toggle('active', i === 0));
  currentView = 'main';
}

function showArchive(type) {
  document.getElementById('main-page').style.display = 'none';
  document.getElementById('platform-bar').style.display = 'none';
  document.getElementById('genre-filter-bar').style.display = 'none';
  document.getElementById('watched-page').classList.toggle('active', type === 'watched');
  document.getElementById('watchlist-page').classList.toggle('active', type === 'watchlist');
  document.querySelectorAll('.nav-tab').forEach((t, i) => {
    t.classList.toggle('active', (type === 'watched' && i === 1) || (type === 'watchlist' && i === 2));
  });
  renderArchive(type);
  currentView = type;
}

function renderArchive(type) {
  const items = Object.values(userData[type]);
  const grid = document.getElementById(type + '-grid');
  const empty = document.getElementById(type + '-empty');
  const sub = document.getElementById(type + '-sub');
  
  sub.textContent = items.length + ' title' + (items.length !== 1 ? 's' : '');
  
  if (!items.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = items.map(item => {
    const poster = item.poster ? imgUrl(item.poster) : '';
    const isWatched = !!userData.watched[item.id];
    const isWatchlist = !!userData.watchlist[item.id];
    allContent[item.id] = allContent[item.id] || item;
    return `
      <div class="card" data-id="${item.id}" onclick="openModal(${item.id})">
        ${poster ? `<img class="card-img" src="${poster}" alt="${item.title}" loading="lazy">` : `<div class="card-img-placeholder">${item.title}</div>`}
        <div class="card-overlay">
          <div class="card-rating">⭐ ${item.rating ? item.rating.toFixed(1) : '?'}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-year">${item.year}</div>
        </div>
        <div class="card-actions" style="opacity:1">
          <button class="action-btn btn-watch ${isWatched ? 'btn-watched-active' : ''}" 
            onclick="event.stopPropagation();toggleItem(${item.id},'watched');renderArchive('${type}')" 
            title="Toggle watched">✓</button>
          <button class="action-btn btn-star ${isWatchlist ? 'btn-star-active' : ''}" 
            onclick="event.stopPropagation();toggleItem(${item.id},'watchlist');renderArchive('${type}')" 
            title="Toggle watchlist">★</button>
        </div>
      </div>`;
  }).join('');
}

// Init
(async function init() {
  await loadData();
  buildGenreFilter();
  await loadPlatformContent();
})();
</script>
